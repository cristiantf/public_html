{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0"><i class="bi bi-person-lock me-2"></i>Seguridad de la Cuenta</h5>
                </div>
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="bg-light d-inline-block p-3 rounded-circle mb-2">
                            <i class="bi bi-shield-lock text-primary" style="font-size: 2.5rem;"></i>
                        </div>
                        <h5 class="fw-bold mb-0">{{ current_user.nombre }}</h5>
                        <p class="text-muted small">Usuario: @{{ current_user.username }}</p>
                    </div>

                    <hr class="text-muted mb-4">

                    <form action="{{ url_for('actualizar_password') }}" method="POST">
                        <div class="mb-3">
                            <label for="current_password" class="form-label fw-semibold">Contraseña Actual</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-key text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 shadow-none" id="current_password" name="current_password" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="new_password" class="form-label fw-semibold">Nueva Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield-plus text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 shadow-none" id="new_password" name="new_password" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold">Confirmar Nueva Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 shadow-none" id="confirm_password" name="confirm_password" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary fw-bold py-2 shadow-sm">
                                <i class="bi bi-check-circle me-2"></i>Actualizar Contraseña
                            </button>
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary py-2">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
