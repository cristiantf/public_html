{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-warning text-dark fw-bold">
                    <i class="bi bi-pencil-square me-2"></i>Editar Datos del Docente
                </div>
                <div class="card-body">
                    <form action="{{ url_for('actualizar_docente') }}" method="POST">
                        <input type="hidden" name="user_id" value="{{ docente.id }}">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Nombre Completo</label>
                                <input type="text" name="nombre" class="form-control shadow-none" value="{{ docente.nombre }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">ID Biométrico (Hardware)</label>
                                <input type="number" name="bio_id" class="form-control shadow-none" value="{{ docente.biometric_id }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Usuario de Acceso</label>
                                <input type="text" name="username" class="form-control shadow-none" value="{{ docente.username }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Nueva Contraseña</label>
                                <input type="password" name="password" class="form-control shadow-none" placeholder="Dejar en blanco para no cambiar">
                            </div>
                            
                            <div class="col-12 mt-3">
                                <div class="d-flex justify-content-between align-items-center p-3 border rounded bg-light">
                                    <div>
                                        <label class="fw-bold mb-0" for="permisoEdit">
                                            <i class="bi bi-key-fill text-warning me-2"></i>Permiso de Puerta Físico
                                        </label>
                                        <div class="small text-muted">Habilita al NodeMCU para reconocer este ID y activar el relé.</div>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="acceso_puerta" id="permisoEdit" 
                                               style="transform: scale(1.3); cursor: pointer;" 
                                               {% if docente.acceso_puerta == 1 %}checked{% endif %}>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-warning fw-bold shadow-sm">Guardar Cambios</button>
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Cancelar y Volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
