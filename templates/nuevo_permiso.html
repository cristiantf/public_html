{% extends "base.html" %}

{% block title %}Registrar Permiso{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 800px;">
        <div class="card-header bg-primary text-white fw-bold py-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-calendar-plus me-2"></i>Registrar Permiso de Docente</h5>
        </div>
        <div class="card-body p-4 bg-white">
            <form action="{{ url_for('nuevo_permiso') }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Docente</label>
                        <select name="docente_id" class="form-select" required>
                            <option value="" disabled selected>Seleccione un docente</option>
                            {% for d in docentes %}<option value="{{ d.id }}">{{ d.nombre }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Fecha del Permiso</label>
                        <input type="date" name="fecha_permiso" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold">Observación (Opcional)</label>
                        <textarea name="observacion" class="form-control" rows="2" placeholder="Ej. Cita médica, comisión, etc."></textarea>
                    </div>
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-light rounded-pill px-4 fw-bold shadow-sm">Cancelar</a>
                    <button class="btn btn-primary px-5 py-2 fw-bold rounded-pill shadow">GUARDAR PERMISO</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
