<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Sistema Biométrico ISTAE</title>
    <!-- Bootstrap 5 y Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --istae-blue: #0d6efd;
            --istae-dark: #1e293b;
        }
        body, html { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            /* Fondo decorativo sutil */
            background-image: 
                radial-gradient(at 0% 0%, rgba(13, 110, 253, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(13, 110, 253, 0.05) 0px, transparent 50%);
            font-family: 'Inter', sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
        .card-login {
            border: none;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .brand-section {
            padding: 40px 40px 20px;
            text-align: center;
        }
        .login-logo {
            width: 80px;
            height: 80px;
            background: rgba(13, 110, 253, 0.1);
            color: var(--istae-blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            font-size: 2.8rem;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }
        .card-login:hover .login-logo {
            transform: scale(1.05) rotate(-5deg);
        }
        .form-section {
            padding: 0 40px 40px;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 8px;
        }
        .input-group {
            background: #f1f5f9;
            border-radius: 14px;
            border: 2px solid transparent;
            transition: all 0.3s;
            overflow: hidden;
        }
        .input-group:focus-within {
            border-color: rgba(13, 110, 253, 0.3);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.05);
        }
        .input-group-text {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding-left: 18px;
        }
        .form-control {
            background: transparent;
            border: none;
            padding: 14px 18px 14px 10px;
            font-weight: 500;
            color: var(--istae-dark);
        }
        .form-control:focus {
            background: transparent;
            box-shadow: none;
        }
        .btn-login {
            background: var(--istae-blue);
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(13, 110, 253, 0.5);
        }
        .password-toggle {
            cursor: pointer;
            padding-right: 18px;
            display: flex;
            align-items: center;
            color: #94a3b8;
            transition: color 0.2s;
        }
        .password-toggle:hover { color: var(--istae-blue); }

        .alert {
            border-radius: 14px;
            border: none;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 16px;
        }

        .footer-text {
            text-align: center;
            margin-top: 30px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card card-login">
            <div class="brand-section">
                <div class="login-logo">
                    <i class="bi bi-fingerprint"></i>
                </div>
                <h4 class="fw-800 text-dark mb-1">Bienvenido</h4>
                <p class="text-muted small">Gestión Biométrica Multimodal ISTAE</p>
            </div>

            <div class="form-section">
                <!-- Notificaciones de Flask -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-danger d-flex align-items-center mb-4 fade show" role="alert">
                                <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                                <div>{{ message }}</div>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label">USUARIO</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" name="username" class="form-control" 
                                   placeholder="Nombre de usuario" required autofocus autocomplete="username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">CONTRASEÑA</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                            <input type="password" name="password" id="passwordField" class="form-control" 
                                   placeholder="••••••••" required autocomplete="current-password">
                            <div class="password-toggle" onclick="togglePassword()">
                                <i class="bi bi-eye-fill" id="eyeIcon"></i>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-login w-100 shadow-sm">
                        INGRESAR AL SISTEMA
                    </button>
                </form>
            </div>
        </div>
        
        <div class="footer-text">
            <p class="mb-1">© 2026 Instituto Alberto Enríquez</p>
            <span class="fw-bold text-secondary">ISTAE</span> | Control de Acceso
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const passField = document.getElementById('passwordField');
            const icon = document.getElementById('eyeIcon');
            
            if (passField.type === 'password') {
                passField.type = 'text';
                icon.classList.replace('bi-eye-fill', 'bi-eye-slash-fill');
            } else {
                passField.type = 'password';
                icon.classList.replace('bi-eye-slash-fill', 'bi-eye-fill');
            }
        }
    </script>
</body>
</html>
