<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e293b">
    <title>{% block title %}Documentos legales{% endblock %} · ISTAE Acceso</title>
    <link rel="icon" type="image/webp" href="{{ url_for('static', filename='img/logo.webp') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: #f1f5f9; color: #334155; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .legal-header { background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; padding: 18px 0; }
        .legal-header img { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 12px; padding: 4px; }
        .legal-card { border: 0; border-radius: 18px; box-shadow: 0 10px 15px -3px rgba(0,0,0,.05); }
        .legal-text { font-size: .93rem; line-height: 1.6; }
        .legal-text h5 { font-size: 1rem; font-weight: 700; margin-top: 1.25rem; color: #1e293b; }
        .legal-text ul, .legal-text ol { padding-left: 1.25rem; }
        .legal-scroll { max-height: 55vh; overflow-y: auto; padding-right: .5rem; }
        .accept-check { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px; padding: 14px 14px 14px 44px; cursor: pointer; }
        .accept-check:has(input:checked) { border-color: #198754; background: #f0fdf4; }
        .accept-check .form-check-input { width: 1.4em; height: 1.4em; margin-left: -30px; margin-top: .1em; }
        .sticky-actions { position: sticky; bottom: 0; background: rgba(241,245,249,.96); backdrop-filter: blur(6px); padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #e2e8f0; }
        .btn { border-radius: 12px; font-weight: 600; padding: 11px 20px; }
        @media (max-width: 575.98px) { .legal-scroll { max-height: 50vh; } .legal-text { font-size: .9rem; } }
    </style>
</head>
<body>
    <header class="legal-header">
        <div class="container d-flex align-items-center gap-3">
            <img src="{{ url_for('static', filename='img/logo.webp') }}" alt="Logo">
            <div class="min-w-0">
                <div class="fw-bold lh-sm">{{ institucion }}</div>
                <small class="text-white-50">Sistema de Control de Acceso y Asistencia</small>
            </div>
        </div>
    </header>

    <main class="container py-3 py-md-4" style="max-width: 920px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show border-0 shadow-sm" role="alert">
                    {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
