{% extends "base.html" %}

{% block title %}Nuevo Docente{% endblock %}

{% block sidebar %}
<div class="py-3 h-100 d-flex flex-column">
    <!-- Encabezado de la Barra Lateral -->
    <div class="text-center mb-4 pt-3">
        <div class="bg-white d-inline-block p-2 rounded-4 mb-2 shadow">
            <img src="{{ url_for('static', filename='img/logo.webp') }}" alt="Logo ISTAE" style="height: 40px; width: auto; object-fit: contain;">
        </div>
        <h6 class="text-white fw-bold mt-1 small">SISTEMA ISTAE</h6>
    </div>
    
    <!-- Menú de Navegación -->
    <div class="nav flex-column flex-grow-1">
        <div class="section-label">General</div>
        <a href="{{ url_for('admin_dashboard') }}" class="nav-link"><i class="bi bi-grid-fill me-3"></i> Dashboard</a>
        <a href="{{ url_for('gestion_asistencia') }}" class="nav-link"><i class="bi bi-calendar-range-fill me-3"></i> Gestión de Asistencia</a>
        <a href="{{ url_for('gestion_permisos') }}" class="nav-link"><i class="bi bi-calendar-check-fill me-3"></i> Gestión de Permisos</a>

        <div class="section-label">Gestión Docente</div>
        <a href="{{ url_for('nuevo_docente') }}" class="nav-link active"><i class="bi bi-person-plus-fill me-3"></i> Nuevo Registro</a>
        <!-- Resto del menú omitido -->
    </div>

    <!-- Botón de Salida Permanente -->
    <div class="mt-auto p-3">
        <hr class="text-white-50">
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger w-100 rounded-pill py-2 small fw-bold">
            <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
        </a>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 800px;">
        <div class="card-header bg-success text-white py-3 border-bottom">
            <h5 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Registrar Nuevo Docente</h5>
        </div>
        <div class="card-body p-4 bg-white">
            <form action="{{ url_for('nuevo_docente') }}" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control" required placeholder="Ej. Ing. Cristian">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">ID Biométrico</label>
                        <input type="number" name="bio_id" class="form-control" required placeholder="101">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Usuario</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="col-12 mt-3">
                        <div class="form-check form-switch p-3 border rounded-4 bg-light d-flex justify-content-between align-items-center">
                            <label class="form-check-label fw-bold mb-0" for="sw_p">Habilitar apertura física por huella</label>
                            <input class="form-check-input ms-0" type="checkbox" name="acceso_puerta" id="sw_p" style="transform: scale(1.3);">
                        </div>
                    </div>
                </div>
                
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-light rounded-pill px-4 fw-bold shadow-sm">Cancelar</a>
                    <button class="btn btn-success px-5 py-2 fw-bold rounded-pill shadow">GUARDAR DOCENTE</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
